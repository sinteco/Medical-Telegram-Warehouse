version: 2

models:
  - name: stg_telegram
    description: Staging model for telegram data
    columns:
      - name: message_id
        description: Primary key for message
        tests:
          - unique
          - not_null

  - name: dim_channels
    description: Dimension table for Telegram channels
    columns:
      - name: channel_key
        description: Surrogate key for channel
        tests:
          - unique
          - not_null
      - name: channel_name
        description: Name of the telegram channel

  - name: dim_dates
    description: Date dimension
    columns:
      - name: date_key
        description: Surrogate key for date
        tests:
          - unique
          - not_null

  - name: fct_messages
    description: Fact table for messages
    columns:
      - name: message_id
        tests:
          - unique
          - not_null
      - name: channel_key
        tests:
          - relationships:
              to: ref('dim_channels')
              field: channel_key
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_dates')
              field: date_key
